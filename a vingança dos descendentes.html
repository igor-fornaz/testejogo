<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>A Vingança dos Descendentes v1.2</title>
<style>
  body { margin:0; background:#1a1a1a; color:#eee; font-family:'Georgia', serif; display:flex; height:100vh; overflow:hidden; }
  #left { width:280px; background:#2c2c2c; padding:15px; border-right:3px solid #8B0000; overflow-y:auto; }
  #right { flex:1; display:flex; flex-direction:column; }
  #battleArea { height:300px; background:linear-gradient(#000, #220000); border-bottom:3px solid #8B0000; position:relative; padding:10px; }
  #playerSprite { position:absolute; bottom:20px; left:80px; font-size:60px; }
  #enemySprite { position:absolute; bottom:20px; right:80px; font-size:60px; }
.hpBar { position:absolute; width:120px; height:10px; background:#000; border:2px solid #fff; }
.hpFill { height:100%; background:#2ecc71; transition:width 0.3s; }
  #battleLog { flex:1; background:#000; border:2px solid #444; padding:10px; overflow-y:auto; }
  #menu { background:#2c2c2c; padding:10px; }
  button { background:#8B0000; color:#fff; border:none; padding:8px 12px; margin:5px; cursor:pointer; font-weight:bold; }
  button:disabled { background:#444; cursor:not-allowed; }
 /* NOVAS CORES DE RARIDADE */
.raro-comum { color:#ffffff; }.raro-incomum { color:#2ecc71; }.raro-raro { color:#3498db; }
.raro-epico { color:#9b59b6; }.raro-lendario { color:#f1c40f; }.raro-mistico { color:#e74c3c; }
.stat { margin:3px 0; }
  h2 { color:#e74c3c; border-bottom:2px solid #8B0000; }
  #shopGrid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.itemLoja { background:#1a1a1a; padding:8px; border:1px solid #444; cursor:pointer; font-size:12px; }
.itemLoja:hover { border-color:#e74c3c; }
</style>
</head>
<body>

<div id="left">
  <h2>👤 <span id="playerName">Herói</span></h2>
  <div class="stat">Nível: <span id="lvl">1</span></div>
  <div class="stat">Classe: <span id="class">-</span></div>
  <div class="stat">HP: <span id="hp">100</span>/<span id="maxHp">100</span></div>
  <div class="stat">ATK: <span id="atk">15</span> | DEF: <span id="def">5</span></div>
  <div class="stat">XP: <span id="xp">0</span>/<span id="xpNext">100</span></div>
  <div class="stat">💰 Ouro: <span id="gold">50</span></div>
  <hr>
  <h3>Equipamentos</h3>
  <div id="equip">Vazio</div>
  <hr>
  <h3>Inventário</h3>
  <div id="inventario"></div>
</div>

<div id="right">
  <div id="battleArea">
    <div id="playerSprite">⚔️</div>
    <div id="enemySprite" style="display:none;">👹</div>
    <div class="hpBar" style="bottom:90px; left:60px;"><div id="playerHpBar" class="hpFill" style="width:100%"></div></div>
    <div class="hpBar" style="bottom:90px; right:60px;"><div id="enemyHpBar" class="hpFill" style="width:100%"></div></div>
    <div id="vsText" style="text-align:center; font-size:24px; margin-top:20px; color:#f1c40f;">CIDADE DE ASHFALL</div>
  </div>

  <div id="battleLog">Bem-vindo, descendente!</div>

  <div id="menu">
    <div id="mainMenu">
      <button onclick="explorar()">Explorar Terras</button>
      <button onclick="abrirLoja()">Loja do Ferreiro</button>
      <button onclick="irCastelo()">Invadir Castelo</button>
      <button onclick="descansar()">Descansar na Taverna $10</button>
    </div>
    <div id="battleMenu" style="display:none;">
      <button onclick="atacar()">Atacar</button>
      <button onclick="usarHabilidade()">Habilidade</button>
      <button onclick="fugir()">Fugir</button>
    </div>
    <div id="shopMenu" style="display:none;">
      <h3>Loja do Ferreiro</h3>
      <div id="shopGrid"></div>
      <button onclick="fecharLoja()">Sair da Loja</button>
    </div>
  </div>
</div>

<script>
const RARIDADES = ['Comum','Incomum','Raro','Épico','Lendário','Místico'];

// TABELA DE ITENS GUERREIRO COM STATS FIXOS
const TABELA_ITENS_GUERREIRO = {
  arma: {
    Lança: [
      {dano:5, perf:5}, {dano:7, perf:7}, {dano:10, perf:10}, {dano:15, perf:20}, {dano:30, perf:40}, {dano:45, perf:60}
    ],
    Espada: [
      {dano:10, duplo:0}, {dano:12, duplo:0}, {dano:15, duplo:5}, {dano:20, duplo:7}, {dano:35, duplo:15}, {dano:60, duplo:30}
    ],
    Machado: [
      {dano:20, erro:45}, {dano:30, erro:45}, {dano:40, erro:40}, {dano:55, erro:35}, {dano:70, erro:25}, {dano:100, erro:15}
    ]
  },
  armadura: [
    {def:20, red:0}, {def:25, red:0}, {def:35, red:0}, {def:50, red:5}, {def:75, red:10}, {def:150, red:20}
  ],
  capacete: [
    {def:10, crit:0}, {def:15, crit:0}, {def:25, crit:5}, {def:40, crit:10}, {def:60, crit:15}, {def:100, crit:30}
  ]
};

const CLASSES = {
  Guerreiro: {
    emoji:"⚔️", armas:['Espada','Lança','Machado'], armaduras:['Pesada'],
    hpBonus: 40, dmgBonus: 5,
    subclasses:{
      Berserker:{bonus:"+10% Dano | Machados erram 50% menos", skill:"Fúria Sangrenta"},
      Paladino:{bonus:"20% Cura ao acertar | Espada Dupla +50%", skill:"Luz Sagrada"},
      Espartano:{bonus:"+20% Perfuração | +15% Defesa", skill:"Formação de Falange"}
    }
  },
  Mago: { emoji:"🔮", armas:['Cajado'], armaduras:['Leve'], hpBonus: 15, dmgBonus: 18, subclasses:{} },
  Arqueiro: { emoji:"🏹", armas:['Arco'], armaduras:['Leve'], hpBonus: 25, dmgBonus: 12, subclasses:{} }
};

let player = {
  name: "Herói", level:1, xp:0, gold:50, maxHp:140, hp:140,
  baseAtk: 10, baseDef: 5,
  class: null, subClass: null,
  equip: { arma:null, armadura:null, capacete:null },
  inventario: [], skills: []
};

let enemy = null;
let inBattle = false;

function gerarItemGuerreiro(tipo){
  let rarIndex = Math.floor(Math.random()*6); // Simplificado pra teste
  let item = {raridade: RARIDADES[rarIndex], rarIndex};

  if(tipo === 'arma'){
    let armaTipo = player.class.armas[Math.floor(Math.random()*3)];
    item.nome = `${RARIDADES[rarIndex]} ${armaTipo}`;
    item.tipo = 'arma';
    let stats = TABELA_ITENS_GUERREIRO.arma[armaTipo][rarIndex];
    item.dano = stats.dano;
    item.perf = stats.perf || 0;
    item.duplo = stats.duplo || 0;
    item.erro = stats.erro || 0;
    item.preco = (rarIndex*80 + 50);
  }
  else if(tipo === 'armadura'){
    item.nome = `${RARIDADES[rarIndex]} Armadura Pesada`;
    item.tipo = 'armadura';
    let stats = TABELA_ITENS_GUERREIRO.armadura[rarIndex];
    item.def = stats.def;
    item.red = stats.red;
    item.preco = (rarIndex*100 + 80);
  }
  else if(tipo === 'capacete'){
    item.nome = `${RARIDADES[rarIndex]} Capacete Pesado`;
    item.tipo = 'capacete';
    let stats = TABELA_ITENS_GUERREIRO.capacete[rarIndex];
    item.def = stats.def;
    item.crit = stats.crit;
    item.preco = (rarIndex*90 + 60);
  }
  return item;
}

function escolherClasse(){
  let escolha = parseInt(prompt("ESCOLHA SUA CLASSE:\n1. Guerreiro\n2. Mago\n3. Arqueiro"));
  let className = Object.keys(CLASSES)[escolha-1];
  player.class = CLASSES[className];
  document.getElementById('playerSprite').innerText = player.class.emoji;
  document.getElementById('class').innerText = className;

  let escolhaSub = parseInt(prompt(`ESCOLHA SUA SUBCLASSE:\n1. Berserker\n2. Paladino\n3. Espartano`));
  let subName = Object.keys(player.class.subclasses)[escolhaSub-1];
  player.subClass = player.class.subclasses[subName];
  player.skills.push(player.subClass.skill);
  atualizarStats();
  log(`Você escolheu: ${className} - ${subName}!`);
}

function getStats(){
  let hp = 100 + player.class.hpBonus + (player.level-1)*20;
  let atk = player.baseAtk + player.class.dmgBonus;
  let def = player.baseDef;
  let crit = 0, perf = 0, reducao = 0, erro = 0, duplo = 0;

  if(player.equip.arma){
    atk += player.equip.arma.dano;
    perf += player.equip.arma.perf || 0;
    duplo += player.equip.arma.duplo || 0;
    erro = player.equip.arma.erro || 0;
  }
  if(player.equip.armadura){ def += player.equip.armadura.def; reducao += player.equip.armadura.red || 0; }
  if(player.equip.capacete){ def += player.equip.capacete.def; crit += player.equip.capacete.crit || 0; }

  // BÔNUS DE SUBCLASSE
  if(player.subClass){
    if(player.subClass.skill === "Fúria Sangrenta"){ atk *= 1.1; erro = Math.max(0, erro/2); } // Berserker
    if(player.subClass.skill === "Formação de Falange"){ perf += 20; def *= 1.15; } // Espartano
  }

  return {hp, atk:Math.floor(atk), def:Math.floor(def), crit, perf, reducao, erro, duplo};
}

function atualizarStats(){
  let stats = getStats();
  player.maxHp = stats.hp;
  if(player.hp > player.maxHp) player.hp = player.maxHp;

  document.getElementById('lvl').innerText = player.level;
  document.getElementById('hp').innerText = player.hp;
  document.getElementById('maxHp').innerText = player.maxHp;
  document.getElementById('atk').innerText = stats.atk;
  document.getElementById('def').innerText = stats.def;
  document.getElementById('xp').innerText = player.xp;
  document.getElementById('xpNext').innerText = player.level * 100;
  document.getElementById('gold').innerText = player.gold;
  document.getElementById('playerHpBar').style.width = (player.hp/player.maxHp*100)+'%';

  let equipHTML = '';
  for(let slot in player.equip){
    if(player.equip[slot]){
      let item = player.equip[slot];
      equipHTML += `<div class="raro-${item.raridade.toLowerCase()}" onclick="desequipar('${slot}')">${slot}: ${item.nome}</div>`;
    } else { equipHTML += `<div>${slot}: Vazio</div>`; }
  }
  document.getElementById('equip').innerHTML = equipHTML;

  let invHTML = player.inventario.map((i,idx)=>`<div class="raro-${i.raridade.toLowerCase()}" onclick="equipar(${idx})">${i.nome}</div>`).join('') || 'Vazio';
  document.getElementById('inventario').innerHTML = invHTML;
}

function log(msg){ document.getElementById('battleLog').innerHTML += msg + "<br>"; document.getElementById('battleLog').scrollTop = 99999; }

function explorar(){
  if(inBattle) return;
  if(Math.random() < 0.7){ iniciarBatalha(); }
  else {
    let tipos = ['arma','armadura','capacete'];
    let item = gerarItemGuerreiro(tipos[Math.floor(Math.random()*3)]);
    log(`Você encontrou: <span class="raro-${item.raridade.toLowerCase()}">${item.nome}</span>`);
    player.inventario.push(item); atualizarStats();
  }
}

function iniciarBatalha(){
  inBattle = true;
  document.getElementById('vsText').innerText = "BATALHA!";
  document.getElementById('enemySprite').style.display = 'block';
  document.getElementById('mainMenu').style.display = 'none';
  document.getElementById('battleMenu').style.display = 'block';

  let lvlInimigo = player.level + Math.floor(Math.random()*2);
  enemy = { nome:"Soldado Imperial", level: lvlInimigo, hp: 50 + lvlInimigo*20, maxHp: 50 + lvlInimigo*20, atk: 8 + lvlInimigo*3, def: 3 + lvlInimigo*2 };
  document.getElementById('enemyHpBar').style.width = '100%';
  log(`<b>UM INIMIGO APARECEU: ${enemy.nome} Lv${enemy.level}</b>`);
}

function calcularDano(){
  let stats = getStats();
  let dano = stats.atk;

  // CHANCE DE ERRAR MACHADO
  if(player.equip.arma && player.equip.arma.erro > 0){
    if(Math.random()*100 < stats.erro){ log("Você errou o golpe!"); return 0; }
  }

  // CRITICO
  if(Math.random()*100 < stats.crit){ dano *= 2; log("GOLPE CRÍTICO!"); }

  // ATAQUE DUPLO ESPADA
  let hits = 1;
  if(player.equip.arma && player.equip.arma.duplo > 0){
    if(Math.random()*100 < stats.duplo){
      hits = 2;
      if(player.subClass.skill === "Luz Sagrada") dano *= 1.5; // Paladino buff
      log("ATAQUE DUPLO!");
    }
  }

  // PERFURAÇÃO
  let defInimigo = enemy.def * (1 - stats.perf/100);
  dano = Math.max(1, dano - defInimigo);

  return {dano: Math.floor(dano), hits};
}

function atacar(){
  let ataque = calcularDano();
  if(ataque.dano > 0){
    enemy.hp -= ataque.dano * ataque.hits;
    log(`Você causou ${ataque.dano * ataque.hits} de dano!`);

    // CURA PALADINO
    if(player.subClass.skill === "Luz Sagrada" && Math.random()<0.2){
      player.hp = Math.min(player.maxHp, player.hp + ataque.dano*0.2);
      log("Você se curou com a Luz Sagrada!");
    }
  }

  document.getElementById('enemyHpBar').style.width = (enemy.hp/enemy.maxHp*100)+'%';
  if(enemy.hp <= 0){ vitoria(); return; }
  setTimeout(turnoInimigo, 600);
}

function turnoInimigo(){
  let stats = getStats();
  let danoInimigo = Math.max(1, enemy.atk - stats.def);
  danoInimigo *= (1 - stats.reducao/100); // Redução de dano da armadura
  player.hp -= Math.floor(danoInimigo);
  document.getElementById('playerHpBar').style.width = (player.hp/player.maxHp*100)+'%';
  log(`${enemy.nome} causou ${Math.floor(danoInimigo)} de dano em você!`);
  if(player.hp <= 0){ derrota(); }
}

function usarHabilidade(){ log(`Você usou: ${player.skills[0]}!`); atacar(); }
function fugir(){ if(Math.random() < 0.5){ log("Você fugiu!"); fimBatalha(); } else { log("Falha ao fugir!"); turnoInimigo(); } }

function vitoria(){
  let xpGanho = enemy.level * 25; let goldGanho = enemy.level * 10;
  player.xp += xpGanho; player.gold += goldGanho;
  log(`<b>VITÓRIA!</b> +${xpGanho} XP +${goldGanho} Ouro`);
  if(Math.random() < 0.4){ let drop = gerarItemGuerreiro(['arma','armadura','capacete'][Math.floor(Math.random()*3)]); player.inventario.push(drop); log(`Drop: <span class="raro-${drop.raridade.toLowerCase()}">${drop.nome}</span>`); }
  if(player.xp >= player.level * 100){ player.level++; player.xp = 0; log(`<b>LEVEL UP! Nível ${player.level}!</b>`); }
  fimBatalha(); atualizarStats();
}

function derrota(){ log("<b>DERROTA!</b> -50 Ouro"); player.gold = Math.max(0, player.gold-50); player.hp = player.maxHp/2; fimBatalha(); atualizarStats(); }
function fimBatalha(){ inBattle = false; enemy = null; document.getElementById('enemySprite').style.display = 'none'; document.getElementById('vsText').innerText = "CIDADE DE ASHFALL"; document.getElementById('mainMenu').style.display = 'block'; document.getElementById('battleMenu').style.display = 'none'; }

function equipar(idx){
  let item = player.inventario[idx];
  if(player.equip[item.tipo]) player.inventario.push(player.equip[item.tipo]);
  player.equip[item.tipo] = item;
  player.inventario.splice(idx,1);
  atualizarStats();
}
function desequipar(slot){
  if(player.equip[slot]){ player.inventario.push(player.equip[slot]); player.equip[slot] = null; }
  atualizarStats();
}

function abrirLoja(){
  document.getElementById('mainMenu').style.display = 'none';
  document.getElementById('shopMenu').style.display = 'block';
  let grid = document.getElementById('shopGrid'); grid.innerHTML = '';
  for(let i=0; i<6; i++){
    let item = gerarItemGuerreiro(['arma','armadura','capacete'][Math.floor(Math.random()*3)]);
    let statsTxt = item.tipo==='arma'? `ATK:${item.dano}` : `DEF:${item.def}`;
    grid.innerHTML += `<div class="itemLoja" onclick="comprarItem(${item.preco}, ${i})">
      <div class="raro-${item.raridade.toLowerCase()}">${item.nome}</div>
      <div>${statsTxt}</div>
      <div>💰 ${item.preco}</div>
    </div>`;
    window['itemTemp'+i] = item;
  }
}
function comprarItem(preco, i){
  if(player.gold >= preco){ player.gold -= preco; player.inventario.push(window['itemTemp'+i]); log(`Comprou por ${preco} ouros!`); atualizarStats(); abrirLoja(); }
  else { alert("Ouro insuficiente!"); }
}
function fecharLoja(){ document.getElementById('shopMenu').style.display = 'none'; document.getElementById('mainMenu').style.display = 'block'; }

function descansar(){ if(player.gold >= 10){ player.gold -= 10; player.hp = player.maxHp; log("HP Recuperado!"); atualizarStats(); } else { alert("Ouro insuficiente!"); } }

function irCastelo(){ if(player.level < 10){ alert("Precisa ser Nível 10!"); return; } enemy = { nome:"IMPERADOR MALVADO", level:15, hp:25000, maxHp:25000, atk:100, def:50 }; inBattle = true; document.getElementById('enemySprite').innerText = "👑"; document.getElementById('enemySprite').style.display = 'block'; document.getElementById('mainMenu').style.display = 'none'; document.getElementById('battleMenu').style.display = 'block'; document.getElementById('enemyHpBar').style.width = '100%'; log("<b>O IMPERADOR APARECE!</b>"); }

// INICIO
let nome = prompt("Qual o nome do seu descendente?") || "Herói";
player.name = nome; document.getElementById('playerName').innerText = player.name;
escolherClasse();
</script>
</body>
</html>
